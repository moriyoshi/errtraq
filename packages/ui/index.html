<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The build replaces the connect-src placeholder with the configured API base; the dev server drops this tag (it needs inline scripts for HMR). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' __ERRTRAQ_CONNECT_SRC__; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <title>errtraq</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
